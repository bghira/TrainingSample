[build-system]
build-backend = "maturin"
requires = ["maturin>=1.16,<2.0"]

[project]
authors = [{ name = "bghira", email = "bghira@users.noreply.github.com" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = ["numpy>=1.21.0", "pillow>=8.0.0"]
description = "High-performance Rust reimplementation of GIL-blocking video/image operations"
license = { text = "MIT" }
name = "trainingsample"
requires-python = ">=3.11"
version = "0.4.0"

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-benchmark>=5.3.1", "maturin>=1.16,<2.0", "pre-commit>=4.7"]

[tool.black]
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
include = '\.pyi?$'
line-length = 88
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.isort]
ensure_newline_before_comments = true
force_grid_wrap = 0
include_trailing_comma = true
line_length = 88
multi_line_output = 3
profile = "black"
use_parentheses = true

[tool.maturin]
features = ["pyo3/extension-module", "python-bindings", "opencv", "simd"]
module-name = "trainingsample"

[tool.poetry.group.dev.dependencies]
pytest-benchmark = "^5.3.1"

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "benchmark: marks tests as benchmarks"
]
minversion = "9.2"
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
