[dependencies]
anyhow = "1.0.104"
fastrand = "2.5"
image = { version = "0.25.10", features = ["png", "jpeg", "webp"] }
imageproc = "0.27"
# Metal GPU acceleration
metal = { version = "0.33", optional = true }
ndarray = "0.17.2"
num_cpus = "1.17"
numpy = { version = "0.30", optional = true }
objc = { version = "0.2", optional = true }
# OpenCV bindings for performance parity
# Limit binding generation to the modules this crate actually uses.
opencv = { version = "0.102", optional = true, default-features = false, features = ["clang-runtime", "imgproc", "videoio"] }
# Python bindings (optional)
pyo3 = { version = "0.30.1", features = ["extension-module"], optional = true }
rayon = "1.12"
tempfile = { version = "3.27", optional = true }
# SIMD optimizations
wide = { version = "1.7", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = ["simd"]
metal = ["dep:metal", "dep:objc"]
opencv = ["dep:opencv"]
python-bindings = ["pyo3", "numpy", "dep:tempfile"]
simd = ["wide"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "trainingsample"

[package]
authors = ["bghira <bghira@users.noreply.github.com>"]
description = "High-performance Rust reimplementation of GIL-blocking video/image operations"
edition = "2021"
license = "MIT"
name = "trainingsample"
rust-version = "1.89"
version = "0.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
